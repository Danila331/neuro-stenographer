[project]
name = "bench-rag"
version = "0.1.0"
description = "Prototype + benchmarks for B50 (summary) and B51 (hybrid RAG search) of the offline stenographer"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26", "requests>=2.31", "onnxruntime>=1.18", "tokenizers>=0.20", "huggingface_hub>=0.24", "psutil"]

[project.optional-dependencies]
export = ["torch>=2.6", "transformers>=4.48", "onnx>=1.16", "onnxscript", "sentence-transformers"]
vecdb = ["sqlite-vec", "usearch", "objectbox"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
