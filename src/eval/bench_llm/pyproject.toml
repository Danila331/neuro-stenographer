[project]
name = "bench-llm"
version = "0.1.0"
description = "Benchmark of local LLMs (llama.cpp) for Russian ASR post-processing: punctuation, speaker fix, meeting protocol"
requires-python = ">=3.11,<3.12"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
]

[project.optional-dependencies]
baseline = [          # only for the BERT punctuation baseline (RUPunct) + ONNX export
  "torch>=2.6",
  "transformers>=4.44",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxscript",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
