[project]
name = "refpipe"
version = "0.1.0"
description = "Python reference pipeline of Neuro-Stenographer (sherpa-onnx), mirrors the Android pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "soxr>=0.5",
  "sherpa-onnx>=1.12",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
refpipe = "refpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
