[project]
name = "stenodata"
version = "0.1.0"
description = "Eval datasets builder for Neuro-Stenographer (ASR / diarization / synthetic dialogs)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12.1",
  "soxr>=0.3",
  "pyroomacoustics>=0.7.5",
  "imageio-ffmpeg>=0.5",
  "piper-tts>=1.3",
  "pyarrow>=15",
  "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stenodata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
