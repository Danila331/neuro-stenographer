[project]
name = "bench-asr"
version = "0.1.0"
description = "Бенчмарк ASR-кандидатов (sherpa-onnx, whisper) для Нейро-стенографиста"
requires-python = ">=3.11,<3.12"
dependencies = [
  "sherpa-onnx>=2.0.1",
  "numpy",
  "soundfile",
  "psutil",
  "scipy",
  "pandas",
  "pytest",
]

[tool.setuptools]
packages = ["bench_asr"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
