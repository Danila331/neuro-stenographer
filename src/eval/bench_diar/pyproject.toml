[project]
name = "bench-diar"
version = "0.1.0"
description = "Diarization benchmark for Neuro-Stenographer (sherpa-onnx)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "sherpa-onnx>=1.12",
  "numpy",
  "scipy",
  "soundfile",
  "scikit-learn",
  "optuna",
  "pyannote.metrics",
  "pyannote.core",
  "pandas",
  "tqdm",
  "huggingface_hub",
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
